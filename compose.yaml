# Compose 编排：
#   web     —— 常驻审计页面服务，宿主机端口通过 HOST_PORT 配置（默认 8080）
#   verify  —— 一次性验收服务（verify profile）：跑规则测试、构建页面、对 web 冒烟后退出。
#              退出码即验收结论：docker compose run --rm verify；echo $?
services:
  web:
    build: .
    image: payload-compat-audit:latest
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
    ports:
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped

  verify:
    image: payload-compat-audit:latest
    build: .
    profiles: ["verify"]
    depends_on:
      web:
        condition: service_healthy
    environment:
      AUDIT_BASE_URL: "http://web:8080"
    entrypoint: ["node", "scripts/verify.mjs"]
    restart: "no"
